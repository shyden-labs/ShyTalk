# Every merge into `develop` deploys to dev (shyden-labs/repo-template#12; operator 2026-10-14), so dev
# always shows develop's head and nobody has to remember a deploy. The last
# step is ShyTalk's own deploy, acting only on the areas the merge changed
# (`changed-files.txt`). Every pull request runs the same job as a rehearsal (shyden-labs/repo-template#35 AC3), so
# its lines run on the pull request's own commit: it uses `dev-rehearsal`, an
# environment that holds no credential, with DEPLOY_REHEARSAL=true, so it
# deploys nothing. A pull request runs its own copy of this file, so what
# keeps the dev credential out of one is `dev` letting only `develop` deploy
# (shyden-labs/repo-template#117), not this file. A repository that hosts nothing deletes this file and
# `tests/unit/deploy-dev.test.ts`, and says why in its README.
#
# Third-party actions are pinned to full SHAs with a `# vX.Y.Z` comment, as in
# ci.yml.
name: deploy-dev
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

# A deploy stopped halfway leaves dev in an undefined state, so a newer merge
# waits for the running deploy instead of cancelling it. A newer pending run
# cancels the older pending one, and a cancelled step reads as unrun (shyden-labs/repo-template#35), so
# each pull request rehearses in its own group, never in develop's.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-dev-rehearsal-{0}', github.event.pull_request.number) || 'deploy-dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-dev:
    # The template itself hosts nothing, so its own develop skips the deploy
    # rather than failing on every merge (shyden-labs/repo-template#43, Shyden 2026-10-27). Its pull
    # requests still rehearse, so the rehearsal is proved here before any
    # project copies it (shyden-labs/repo-template#121, Shyden 2026-10-28). A repository made from the
    # template has another name, so it runs this job, and the job fails until
    # the last step is filled in.
    if: ${{ github.repository != 'shyden-labs/repo-template' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The dev credential lives in `dev`, which must let only `develop` deploy
    # (shyden-labs/repo-template#117), never as a repository secret. A pull request rehearses in
    # `dev-rehearsal`, which GitHub creates on first use and which holds nothing.
    environment: ${{ github.event_name == 'pull_request' && 'dev-rehearsal' || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # What this deploy covers: the files the push changed, or every file on
      # a hand-started run or a branch's first push (no earlier commit to diff).
      # A pull request has no `before`, so its rehearsal diffs against its base.
      - name: List the files this merge changed
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > changed-files.txt
          else
            git ls-files > changed-files.txt
          fi
          {
            echo '### Files this deploy covers'
            echo '```'
            cat changed-files.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143), as in ci.yml.
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
      # ShyTalk's dev deploy (shyden-labs/ShyTalk#44; decisions 216, 217): the
      # dev origin Worker `shytalk-dev` on the Non-Prod account, the website's
      # front door (workers/web, plan 3 Task 1, shyden-labs/ShyTalk#51), only
      # when the site, its Worker, the migrations, the environment package, the
      # UI document or its publisher, the lockfile or this file changed. It replaces the door spike's echo Worker, deleted in
      # shyden-labs/ShyTalk#31. The origin refuses every request without the
      # door secret, so the deploy sets it from the dev environment (decision
      # 216). A rehearsal only bundles it, with no credential. Doors never
      # deploy from here: they live in the production account and deploy only
      # through `production`, with Shyden's approval.
      - name: Deploy the changed areas to dev
        env:
          DEPLOY_REHEARSAL: ${{ github.event_name == 'pull_request' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOOR_SECRET: ${{ secrets.DOOR_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT }}
        run: |
          if ! grep -qE '^(apps/web/|workers/web/|migrations/|packages/environment/|packages/mail/|packages/ui-document/|manifests/|scripts/publish-ui\.ts$|scripts/announce-ui\.ts$|package-lock\.json$|\.github/workflows/deploy-dev\.yml$)' changed-files.txt; then
            echo "Nothing deployable changed, so dev deploys nothing."
            exit 0
          fi
          npm run build:web || { echo "::error title=deploy-dev failed::the website did not build"; exit 1; }
          cd workers/web
          if [ "$DEPLOY_REHEARSAL" = true ]; then
            npx wrangler deploy --dry-run --env dev --outdir "$RUNNER_TEMP/web" || { echo "::error title=deploy-dev failed::workers/web did not bundle"; exit 1; }
            exit 0
          fi
          # Plan 4 Task 2 (shyden-labs/ShyTalk#75, decisions 219, 220): the
          # database exists, is migrated and is marked `dev` before the Worker
          # deploys, or the site answers 503 to everyone. Only Wrangler
          # 4.157.0's not-found message creates it; any other error stops the
          # job, with no retry.
          info=$(npx wrangler d1 info shytalk-dev --env dev 2>&1) || {
            printf '%s\n' "$info"
            case "$info" in
              *"Couldn't find a D1 DB named 'shytalk-dev'"*) npx wrangler d1 create shytalk-dev --location apac || { echo "::error title=deploy-dev failed::shytalk-dev was not created"; exit 1; } ;;
              *) echo "::error title=deploy-dev failed::d1 info shytalk-dev failed"; exit 1 ;;
            esac
          }
          npx wrangler d1 migrations apply DB --remote --env dev || { echo "::error title=deploy-dev failed::the shytalk-dev migrations did not apply"; exit 1; }
          npx wrangler d1 execute DB --remote --env dev --command "CREATE TABLE IF NOT EXISTS environment_marker (name TEXT NOT NULL); INSERT INTO environment_marker (name) SELECT 'dev' WHERE NOT EXISTS (SELECT 1 FROM environment_marker);" || { echo "::error title=deploy-dev failed::the shytalk-dev marker was not written"; exit 1; }
          marker=$(npx wrangler d1 execute DB --remote --env dev --json --command "SELECT name FROM environment_marker") || { echo "::error title=deploy-dev failed::the shytalk-dev marker could not be read back"; exit 1; }
          if [ "$(printf '%s' "$marker" | jq -c '[.[0].results[].name]')" != '["dev"]' ]; then
            printf '%s\n' "$marker"
            echo "::error title=deploy-dev failed::shytalk-dev must hold exactly one marker row, dev"
            exit 1
          fi
          echo "Read back: shytalk-dev is marked dev."
          # Plan 4 Task 6 (shyden-labs/ShyTalk#79): the app's UI document
          # (manifests/ui.json) is published to the migrated database before the
          # Worker that serves it deploys, through a Wrangler remote binding to
          # the database by id (Shyden, 2026-11-06). It publishes nothing when
          # dev already serves that document.
          ui_db=$(npx wrangler d1 info shytalk-dev --env dev --json | jq -er '.uuid') || { echo "::error title=deploy-dev failed::the shytalk-dev id could not be read"; exit 1; }
          (cd "$GITHUB_WORKSPACE" && UI_ENVIRONMENT=dev UI_DATABASE_NAME=shytalk-dev UI_DATABASE_ID="$ui_db" UI_PUBLISHED_BY=ci:deploy-dev node scripts/publish-ui.ts) || { echo "::error title=deploy-dev failed::the UI document was not published"; exit 1; }
          npx wrangler deploy --env dev || { echo "::error title=deploy-dev failed::workers/web did not deploy"; exit 1; }
          if [ -z "$DOOR_SECRET" ]; then
            echo "::error title=DOOR_SECRET missing::Set DOOR_SECRET in the dev environment (decision 216); until then the dev origin refuses every request."
            exit 1
          fi
          printf '%s' "$DOOR_SECRET" | npx wrangler secret put DOOR_SECRET --env dev || { echo "::error title=deploy-dev failed::the dev door secret was not set"; exit 1; }
          # shyden-labs/ShyTalk#76: dev app sign-in answers 503 until the
          # Worker holds Better Auth's secret.
          if [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "::error title=BETTER_AUTH_SECRET missing::Set BETTER_AUTH_SECRET in the dev environment (shyden-labs/ShyTalk#76); until then dev app sign-in answers 503."
            exit 1
          fi
          printf '%s' "$BETTER_AUTH_SECRET" | npx wrangler secret put BETTER_AUTH_SECRET --env dev || { echo "::error title=deploy-dev failed::the dev Better Auth secret was not set"; exit 1; }
          # shyden-labs/ShyTalk#88: dev mails through Oracle with its own
          # user's key; sendMail answers unavailable until the Worker holds
          # all five Oracle settings.
          for name in OCI_TENANCY OCI_USER OCI_FINGERPRINT OCI_PRIVATE_KEY OCI_COMPARTMENT; do
            if [ -z "${!name}" ]; then
              echo "::error title=$name missing::Set $name in the dev environment (shyden-labs/ShyTalk#88); until then dev sends no mail."
              exit 1
            fi
            printf '%s' "${!name}" | npx wrangler secret put "$name" --env dev || { echo "::error title=deploy-dev failed::the dev $name was not set"; exit 1; }
          done
          # Plan 4 Task 8 (shyden-labs/ShyTalk#81; Shyden 2026-11-07): last,
          # every open app hears the newest UI version. Each deploy makes a
          # fresh announce secret, puts it in the Worker and calls the Worker
          # with it, so nothing is stored.
          announce_secret=$(openssl rand -hex 32) || { echo "::error title=deploy-dev failed::no announce secret was made"; exit 1; }
          echo "::add-mask::$announce_secret"
          printf '%s' "$announce_secret" | npx wrangler secret put ANNOUNCE_SECRET --env dev || { echo "::error title=deploy-dev failed::the dev announce secret was not set"; exit 1; }
          (cd "$GITHUB_WORKSPACE" && ANNOUNCE_ENVIRONMENT=dev ANNOUNCE_SECRET="$announce_secret" node scripts/announce-ui.ts) || { echo "::error title=deploy-dev failed::open apps were not told the UI version"; exit 1; }
