# Every third-party `uses:` is a full 40-hex commit SHA with a trailing
# `# vX.Y.Z` comment. A tag is mutable and can be repointed by anyone who can
# push to that action's repo; the SHA is the only immutable reference. The
# comment is what makes a Dependabot bump reviewable by a human rather than an
# opaque hex swap -- so never remove it, and never let it drift from the SHA.
name: build-and-test
on:
  pull_request:
  push:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      # GitHub opens Dependabot SECURITY fixes against the default branch
      # only; `target-branch` in dependabot.yml steers version updates alone.
      # With any default but develop, every security fix lands outside the
      # develop gate. First step, so a wrong default fails in seconds (issue shyden-labs/repo-template#46).
      - name: The default branch is develop
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$DEFAULT_BRANCH" != "develop" ]; then
            echo "::error::The default branch is '$DEFAULT_BRANCH', not develop, so Dependabot security fixes open outside the develop gate. Set it in Settings > General > Default branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      # The docs-only fast path (scripts/change-scope.ts): every job runs and
      # reports; a docs change skips everything but the install, audit and format check.
      - id: classify
        run: node scripts/change-scope.ts
      - run: node scripts/npm-ci.ts
      # Any known vulnerability, of any severity and dev dependencies included, fails the build (shyden-labs/repo-template#156).
      - name: Audit
        run: npm audit --audit-level=low
      # The static checks (issue shyden-labs/repo-template#61); .githooks/pre-push runs the same three before every push.
      - name: Typecheck
        if: steps.classify.outputs.scope != 'docs-only'
        run: npm run typecheck
      - name: Lint
        if: steps.classify.outputs.scope != 'docs-only'
        run: npm run lint
      - name: Format
        run: npm run format:check
      - if: steps.classify.outputs.scope != 'docs-only'
        run: npm run test:unit

  # Coverage runs apart from the 1 s unit step: one overall threshold over the
  # TypeScript under scripts/ (vitest.unit.config.ts, shyden-labs/repo-template#149).
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      # The docs-only fast path (scripts/change-scope.ts): every job runs and
      # reports; a docs change skips everything but the install, audit and format check.
      - id: classify
        run: node scripts/change-scope.ts
      - run: node scripts/npm-ci.ts
      - if: steps.classify.outputs.scope != 'docs-only'
        run: npm run test:coverage
