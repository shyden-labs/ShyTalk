# Every third-party `uses:` is a full 40-hex commit SHA with a trailing
# `# vX.Y.Z` comment. A tag is mutable and can be repointed by anyone who can
# push to that action's repo; the SHA is the only immutable reference. The
# comment is what makes a Dependabot bump reviewable by a human rather than an
# opaque hex swap -- so never remove it, and never let it drift from the SHA.
name: build-and-test
on:
  pull_request:
  push:
    branches: [develop]

jobs:
  build-and-test:
    # Read-only, so it may restore downloads from the cache (global rule 2026-11-26; shyden-labs/ShyTalk#375).
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # GitHub opens Dependabot SECURITY fixes against the default branch
      # only; `target-branch` in dependabot.yml steers version updates alone.
      # With any default but develop, every security fix lands outside the
      # develop gate. First step, so a wrong default fails in seconds (issue shyden-labs/repo-template#46).
      - name: The default branch is develop
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$DEFAULT_BRANCH" != "develop" ]; then
            echo "::error::The default branch is '$DEFAULT_BRANCH', not develop, so Dependabot security fixes open outside the develop gate. Set it in Settings > General > Default branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      # The docs-only fast path (scripts/change-scope.ts): every job runs and
      # reports; a docs change skips everything but the install, audit and format check.
      - id: classify
        run: node scripts/change-scope.ts
      - run: node scripts/npm-ci.ts
      # Any known vulnerability, of any severity and dev dependencies included, fails the build (shyden-labs/repo-template#156).
      - name: Audit
        run: node scripts/audit.ts
      # The static checks (issue shyden-labs/repo-template#61); .githooks/pre-push runs the same three before every push.
      - name: Typecheck
        if: steps.classify.outputs.scope != 'docs-only'
        run: npm run typecheck
      - name: Lint
        if: steps.classify.outputs.scope != 'docs-only'
        run: npm run lint
      - name: Format
        run: npm run format:check
      - if: steps.classify.outputs.scope != 'docs-only'
        run: npm run test:unit

  # Coverage runs apart from the 1 s unit step: one overall threshold over the
  # TypeScript under scripts/ (vitest.unit.config.ts, shyden-labs/repo-template#149).
  coverage:
    # Read-only, so it may restore downloads from the cache (global rule 2026-11-26; shyden-labs/ShyTalk#375).
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      # The docs-only fast path (scripts/change-scope.ts): every job runs and
      # reports; a docs change skips everything but the install, audit and format check.
      - id: classify
        run: node scripts/change-scope.ts
      - run: node scripts/npm-ci.ts
      - if: steps.classify.outputs.scope != 'docs-only'
        run: npm run test:coverage

  # The site smoke (shyden-labs/ShyTalk#51 AC4): the built pages served by the
  # real web Worker under `wrangler dev` as DEV, behind the door with a fresh
  # secret per run; each language's home 200 and 404 404, in its language,
  # with no CSP refusal (playwright.config.ts, tests/smoke/), on Chromium,
  # Firefox, WebKit (shyden-labs/ShyTalk#109) and Edge (shyden-labs/ShyTalk#239).
  web-smoke:
    # Read-only, so it may restore downloads from the cache (global rule 2026-11-26; shyden-labs/ShyTalk#375).
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Microsoft's image for the lockfile's exact Playwright: browsers and their system libraries come
    # with it, so no run waits on the runner's apt mirror (shyden-labs/ShyTalk#281). A unit test
    # keeps the tag equal to the lockfile's version. It runs as root so Edge can be installed
    # (shyden-labs/ShyTalk#239).
    container:
      # Pinned by digest as well as tag: a tag can be repointed, a digest cannot (global rule 2026-11-26;
      # shyden-labs/ShyTalk#375). The digest is read from mcr.microsoft.com for the tag when Playwright moves.
      image: mcr.microsoft.com/playwright:v1.65.1-resolute@sha256:dcf385f7a31aa1cbb0a7a0c97a539142bf70480b661f89f26a774ec1fe2edd1d
    # Built for dev, so each page's preview names the dev origin, and the smoke checks it (shyden-labs/ShyTalk#198).
    env:
      SITE_ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The checkout belongs to the runner's user, so git, running as root here, refuses it until it is marked
      # safe (shyden-labs/ShyTalk#239).
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      # The docs-only fast path (scripts/change-scope.ts): every job runs and
      # reports; a docs change skips everything but the install.
      - id: classify
        run: node scripts/change-scope.ts
      - run: node scripts/npm-ci.ts
      # Edge is not in Microsoft's image; its own installer adds it each run (shyden-labs/ShyTalk#239). Its .deb files,
      # and the OS packages --with-deps pulls, are kept in the cache between runs, after yawelo-idle#1092/#1115
      # (shyden-labs/ShyTalk#375: on 2026-11-26 a run failed when azure.archive.ubuntu.com could not be reached). apt
      # still reads the current lists, so a newer Edge still arrives; older Edge files are dropped before saving.
      - name: Keep apt's downloads in the Edge cache folder
        if: steps.classify.outputs.scope != 'docs-only'
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p /root/edge-debs/partial
          printf '%s\n' 'Dir::Cache::Archives "/root/edge-debs";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/99-edge-cache
      # The run id never matches, so the prefix restores the newest download.
      - name: Restore the Edge download
        if: steps.classify.outputs.scope != 'docs-only'
        id: edge-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/edge-debs
          key: msedge-debs-${{ github.run_id }}
          restore-keys: msedge-debs-
      - name: Install Microsoft Edge
        if: steps.classify.outputs.scope != 'docs-only'
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          status=0
          timeout --kill-after=5 165 node_modules/.bin/playwright install --with-deps msedge 2>&1 | tee "$RUNNER_TEMP/edge-install.log" || status=$?
          if [ "$status" = 124 ]; then
            echo "::error::Edge install stalled at 165 s; its last download was: $(grep -E '^Get:' "$RUNNER_TEMP/edge-install.log" | tail -n 1)"
          fi
          exit "$status"
      - name: Read the installed Edge version and drop older downloads
        if: steps.classify.outputs.scope != 'docs-only'
        id: edge
        run: |
          version=$(dpkg-query -W -f='${Version}' microsoft-edge-stable)
          test -n "$version"
          find /root/edge-debs -name 'microsoft-edge-stable_*.deb' ! -name "microsoft-edge-stable_${version}_*" -delete
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Save the Edge download for later runs
        if: steps.classify.outputs.scope != 'docs-only' && steps.edge-cache.outputs.cache-matched-key != format('msedge-debs-{0}', steps.edge.outputs.version)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/edge-debs
          key: msedge-debs-${{ steps.edge.outputs.version }}
      - name: Build the site
        if: steps.classify.outputs.scope != 'docs-only'
        run: npm run build:web
      # Firefox refuses to launch as root with another user's HOME, and the runner sets its own HOME for every
      # step (over the container's), so root gets its own here (shyden-labs/ShyTalk#239).
      - name: Smoke
        if: steps.classify.outputs.scope != 'docs-only'
        env:
          WRANGLER_SEND_METRICS: 'false'
          HOME: /root
          # Each browser's own output in the log, so a browser that closes mid-test says why (shyden-labs/ShyTalk#321).
          DEBUG: 'pw:browser'
        run: |
          SMOKE_DOOR_SECRET=$(openssl rand -hex 32)
          export SMOKE_DOOR_SECRET
          SMOKE_SITE_PASSWORD=$(openssl rand -hex 32)
          export SMOKE_SITE_PASSWORD
          npm run test:smoke
      # One suite, run unchanged on every target (shyden-labs/ShyTalk#109): the package's one-suite prints
      # each browser's total and fails on any difference, skip, unlisted run or untagged group-only test.
      # Both steps run after a red smoke too, so the totals always print.
      # The shared package's checks (shyden-labs/ShyTalk#239) need the tests listed per browser; listing
      # starts no server, but the config refuses to load without its two values, so placeholders are given.
      - name: List the tests each browser should run
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs-only' }}
        run: SMOKE_DOOR_SECRET=list SMOKE_SITE_PASSWORD=list node_modules/.bin/playwright test -c tests/smoke --list --reporter=json > test-results/smoke-list.json
      - name: One-suite checks over the desktop browsers
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs-only' }}
        run: node_modules/.bin/one-suite --group desktop=chromium,firefox,webkit,msedge --list test-results/smoke-list.json --report test-results/smoke-report.json --assertions test-results/smoke-assertions.json

  # The integration suite (shyden-labs/ShyTalk#59, decision 230: a required
  # check): tests under tests/integration against Cloudflare's own local
  # engines, from the real Wrangler config, after the real migrations
  # (vitest.integration.config.ts). CI only.
  integration:
    # Read-only, so it may restore downloads from the cache (global rule 2026-11-26; shyden-labs/ShyTalk#375).
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      # The docs-only fast path (scripts/change-scope.ts): every job runs and
      # reports; a docs change skips everything but the install.
      - id: classify
        run: node scripts/change-scope.ts
      - run: node scripts/npm-ci.ts
      - name: Integration
        if: steps.classify.outputs.scope != 'docs-only'
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm run test:integration

  # The SonarCloud quality gate, blocking (shyden-labs/repo-template#27, shyden-labs/repo-template#60): the reusable workflow
  # scans, then fails unless this scan's gate is OK (docs/sonarcloud.md).
  sonarcloud:
    uses: ./.github/workflows/sonarcloud.yml
    with:
      organization: shyden-labs
      project-key: shyden-labs_ShyTalk
    secrets: inherit
