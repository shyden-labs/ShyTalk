# SCRATCH, never merged: plan 6.1 Task 1 Step 6 proves the app compiles for
# Android and the iOS Simulator on CI's free runners (the laptop has too little
# memory for Gradle beside other runs). Runs only on the scratch branch.
name: scratch-app-build
on:
  push:
    branches: [scratch/plan-61]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci
        working-directory: apps/app
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/app
        env:
          SHYTALK_ENV: dev
      - name: Gradle assembleDebug
        working-directory: apps/app/android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          start=$(date +%s)
          ./gradlew :app:assembleDebug --no-daemon
          echo "assembleDebug took $(( $(date +%s) - start )) s"
          ls -la app/build/outputs/apk/debug/
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci
        working-directory: apps/app
      - run: npx expo prebuild --platform ios
        working-directory: apps/app
        env:
          SHYTALK_ENV: dev
      - name: xcodebuild for the simulator
        working-directory: apps/app/ios
        run: |
          xcodebuild -version
          start=$(date +%s)
          xcodebuild -workspace ShyTalk.xcworkspace -scheme ShyTalk -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
          echo "xcodebuild took $(( $(date +%s) - start )) s"
