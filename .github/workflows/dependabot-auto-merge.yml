name: Dependabot Auto-merge

on:
  pull_request:
    # SHY-0242: Dependabot now targets develop (dependabot.yml target-branch),
    # so its auto-merge fires on develop PRs. --auto waits for the develop
    # ruleset's required checks (Detect Changes / Analyze JavaScript / PR Gate),
    # so a bump merges only once CI is green — the same gate as main.
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 5
    steps:
      # SHY-0569: the judge runs from the base branch, never the PR's own code.
      - name: Check out the base branch (never the PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # Unreadable metadata must not stop the job before auto-merge is
      # switched off below; the judge reads an empty type as "no".
      - name: Fetch Dependabot metadata
        id: metadata
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # SHY-0569: #2190's metadata said 12.19.0 / semver-minor while its title
      # and body said 12.18.0 -> 13.0.0, and a major merged by itself. The
      # judge allows auto-merge only when the metadata AND every version pair
      # in the PR's title and body are patch or minor (GitHub Actions keep
      # their SHA-pinned exception). env-bound, never inline ${{ }} in run:.
      - name: Determine if auto-mergeable
        id: check
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: node scripts/dependabot-update-type.js

      - name: Auto-approve
        if: steps.check.outputs.merge == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge
        if: steps.check.outputs.merge == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SHY-0569: a push judged "no" (or a judge that failed) switches off an
      # auto-merge armed by an earlier push; before, it was left armed.
      - name: Switch auto-merge off
        if: always() && steps.check.outputs.merge != 'true'
        run: |
          armed=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$armed" = "true" ]; then
            gh pr merge --disable-auto "$PR_URL"
            echo "auto-merge switched off for $PR_URL"
          else
            echo "auto-merge was not armed for $PR_URL"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
