name: SonarCloud Analysis

# Per-ref concurrency: newer commit on the same PR cancels in-progress
# Sonar runs. See lint.yml for the full rationale + the propagation gap
# in pr-checks.yml's concurrency. Pinned by
# express-api/tests/scripts/reusable-workflow-concurrency.test.js.
concurrency:
  group: sonarcloud-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out'
        type: string
        required: true
      app_changed:
        description: 'Whether Kotlin/Android source changed'
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to analyse (default: main)'
        type: string
        default: 'main'
      app_changed:
        description: 'Include Kotlin/Android coverage'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    # SHY-0355 — 15 was not enough and cancelled the job mid-analysis.
    #
    # `PR Gate` treats a `cancelled` dependency as a failure, so the pull
    # request showed every check passing — including SonarCloud's OWN external
    # `SonarCloud Code Analysis` result — while the gate was red. That reads as
    # "Sonar found something", so the natural response was to re-run, which cost
    # another fifteen minutes and failed the same way.
    #
    # Measured on PR #1812: two runs cancelled at 15m18s and 15m03s against the
    # 15m budget, while a SUCCESSFUL run of the same job took 9m37s. So the old
    # budget left about five minutes of headroom and any queueing or cache miss
    # spent it. Same shape as SHY-0329 on the driver-checks job.
    #
    # Pinned by express-api/tests/scripts/sonarcloud-timeout.test.js, which
    # reads THIS file so the value cannot drift from what CI runs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      # SHY-0625: no token means no scan, and no scan is a fail, never a skip
      # that succeeds. Checked first so a missing token fails in seconds, not
      # after the test steps below.
      - name: Require SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is empty: set it as an Actions secret, and as a Dependabot secret for Dependabot PRs"
            echo "SonarCloud: FAILED. Scan: did not run (SONAR_TOKEN is empty)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Cache the SonarCloud scanner engine (SHY-0068). AWS WAF
      # intermittently blocks runner IPs on the engine download (PR #1049,
      # PR #1001) — cache the artefact instead of retrying the flake
      # (replaces the deleted sonarcloud-auto-retry.yml per
      # feedback-no-auto-retry-workflows). ~/.sonar/cache is internally
      # versioned + additive, so the key is OS-scoped with a run-unique
      # suffix: GitHub cache entries are immutable per key, so a constant
      # key would never re-save; run-unique keys always save fresh while
      # restore-keys restores the newest entry. Do NOT set SONAR_USER_HOME
      # — CI and local pre-push scans must share this default path.
      - name: Cache SonarCloud scanner engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sonar

      # `cache-hit` is 'true' only on EXACT key match — never with a
      # run-unique key — so the operationally meaningful signal is whether
      # the restore actually produced content (reviewer finding, SHY-0068).
      - name: Engine cache status
        run: |
          if [ -d "$HOME/.sonar/cache" ] && [ -n "$(ls -A "$HOME/.sonar/cache" 2>/dev/null)" ]; then
            echo "engine-cache: HIT (restored via prefix-match; engine download skipped)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "engine-cache: MISS (cold cache; engine will download and be saved)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/setup-jdk-gradle

      - uses: ./.github/actions/setup-node

      # EPIC-0003 / SHY-0120: the express cron Jest tests also exercise the
      # REAL R2 (S3 stand-in, versitygw) + email (Mailpit) backends, so provision them here
      # too (mirrors test-backend.yml + local/docker-compose). Started before
      # the Firebase emulators so the image pulls overlap with emulator boot.
      - uses: ./.github/actions/start-local-services

      # EPIC-0003 Phase 3: run the express Jest suite against the REAL
      # Firebase emulator stack ($0, credential-free under projectId
      # demo-shytalk) instead of jest.mock(firebase). The JVM the
      # Firestore/RTDB emulators need is already provided by
      # setup-jdk-gradle above (no second JVM setup).
      - uses: ./.github/actions/start-firebase-emulators

      # Block until the S3 stand-in + Mailpit answer before running the suite — the
      # cron tests hit both in beforeAll, so an unready container is a hard
      # failure, not a flake.
      - name: Wait for the S3 stand-in + Mailpit to be ready
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9002/health >/dev/null \
               && curl -sf http://localhost:8025/api/v1/messages >/dev/null; then
              echo "S3 stand-in + Mailpit ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          # SHY-0544: name the container that never answered and show why.
          unready=""
          curl -sf http://localhost:9002/health >/dev/null || unready="s3"
          curl -sf http://localhost:8025/api/v1/messages >/dev/null || unready="$unready mailpit"
          for c in $unready; do
            echo "::group::last 50 log lines of container $c"
            docker logs --tail 50 "$c" 2>&1 || true
            echo "::endgroup::"
          done
          echo "::error::container(s) not ready within 60s:$unready"
          exit 1

      - uses: ./.github/actions/install-ffmpeg

      - name: Run Express API tests with coverage
        # `--experimental-vm-modules` lets Jest resolve dynamic `import()`
        # callbacks (data-export-builder.js uses `import('archiver')` since
        # archiver v8 is ESM-only). Mirrors the `test` script in
        # express-api/package.json + test-backend.yml + .husky/pre-push.
        #
        # No `|| true` fallback — the step previously swallowed Jest
        # failures and Sonar then uploaded partial coverage as if all
        # tests passed. Per feedback-warnings-are-failures, a failing
        # test must fail the gate. If this surfaces a real regression
        # the right fix is to repair the test, not restore the bypass.
        run: |
          cd express-api && npm ci
          node --experimental-vm-modules node_modules/.bin/jest --coverage --coverageReporters=lcov

      - name: Download build outputs
        if: inputs.app_changed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-outputs
        continue-on-error: true

      - uses: ./.github/actions/decode-google-services
        if: inputs.app_changed
        with:
          dev-base64: ${{ secrets.GOOGLE_SERVICES_DEV_BASE64 }}
          prod-base64: ${{ secrets.GOOGLE_SERVICES_PROD_BASE64 }}

      - name: Run Kotlin JVM tests (fallback if no build artifacts)
        if: inputs.app_changed
        run: |
          if [ -d "shared/build/test-results" ]; then
            echo "Build artifacts found — skipping rebuild"
          else
            echo "No build artifacts — running tests with coverage"
            ./gradlew :shared:jvmTest testDevDebugUnitTest jacocoDevDebugUnitTestReport
          fi

      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar -Dsonar.token=$SONAR_TOKEN -x :app:sonar

      # SHY-0625: the scanner uploads and stops (`sonar.qualitygate.wait` is
      # false in build.gradle.kts), so this step reads the result: it waits for
      # SonarCloud to process THIS analysis, checks a PR's verdict is for the
      # commit checked out above, and fails on anything but a passed gate.
      # CEILING_SECONDS is provisional until three waits are measured
      # (SHY-0625's Performance AC). Pinned by
      # express-api/tests/scripts/sonar-verdict.unit.test.js and
      # express-api/tests/scripts/sonarcloud-gate-blocks.test.js.
      - name: Read the SonarCloud verdict
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          REPORT_TASK_PATH: build/sonar/report-task.txt
          CEILING_SECONDS: '300'
          EXPECTED_SHA: ${{ inputs.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/sonar-verdict.js
