# The SonarCloud quality gate, blocking (issue shyden-labs/repo-template#27; Shyden 2026-10-18: "don't
# pass if it doesn't run", "make sure we check the results and fail the
# workflow if it fails"; then every project adopts it, blocking).
#
# Reusable: a project calls it from its pull-request workflow and makes the
# job a required check (docs/sonarcloud.md has the one-time setup):
#
#   sonarcloud:
#     uses: ./.github/workflows/sonarcloud.yml
#     with:
#       organization: shyden-labs
#       project-key: shyden-labs_<repo>
#     secrets: inherit
#
# It fails when the token is missing, scans with the coverage the unit suite
# wrote, then reads the gate of THAT scan's analysis and is green only on OK.
# No step skips the scan and succeeds, and nothing swallows a failure
# (tests/unit/workflow-honesty.test.ts).
#
# Every third-party `uses:` is a full commit SHA with its `# vX.Y.Z` comment.
name: sonarcloud
on:
  workflow_call:
    inputs:
      organization:
        required: true
        type: string
      project-key:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: The SonarCloud token is set
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error title=SONAR_TOKEN is missing::Set SONAR_TOKEN as an Actions secret, and as a Dependabot secret for Dependabot pull requests (docs/sonarcloud.md)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: node scripts/npm-ci.ts
      - run: npm run test:coverage
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ inputs.organization }}
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
      - name: Read the quality gate of this scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node scripts/sonar-verdict.ts .scannerwork/report-task.txt
