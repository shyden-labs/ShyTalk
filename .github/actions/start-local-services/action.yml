name: 'Start Local Services'
description: 'Start Docker containers for LiveKit, the S3 stand-in (versitygw), and Mailpit'
runs:
  using: 'composite'
  steps:
    - name: Start local services
      shell: bash
      run: |
        docker run -d --name livekit -p 7880:7880 -p 7881:7881 -p 7882:7882 \
          -v ${{ github.workspace }}/local/livekit.yaml:/etc/livekit.yaml \
          livekit/livekit-server:v1.12.0 --config /etc/livekit.yaml
        # SHY-0544: versitygw stands in for Cloudflare R2. Same image and
        # digest as local/docker-compose.yml (Dependabot bumps that file; a
        # test refuses the two drifting apart). Data lives on tmpfs: every
        # run seeds its own bucket.
        docker run -d --name s3 -p 9002:7070 --tmpfs /data \
          -e ROOT_ACCESS_KEY=localadmin -e ROOT_SECRET_KEY=localsecret \
          versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
          --health /health posix /data
        docker exec s3 versitygw --version
        docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:v1.30.1
