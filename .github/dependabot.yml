version: 2
updates:
  # Gradle dependencies (libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    # SHY-0242: updates flow through the develop integration branch (git-flow),
    # where they are CI-gated and auto-merged on green — not straight to main.
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "gradle"
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        update-types:
          - "patch"
    ignore:
      - dependency-name: "com.google.firebase:firebase-bom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.multiplatform"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        update-types: ["version-update:semver-major"]
      # Minor bumps gated on the navigation-compose ecosystem: compose 1.11.0+
      # needs a navigation-compose whose Skiko aligns, but stable nav tops out
      # at 2.9.2 (compose 1.10.x) and the next (2.10.0-alpha01) targets compose
      # 1.12.0-alpha01 + the JetBrains EAP repo. Ignoring minor (and major)
      # until a stable compose + stable nav 2.10 align — patches on 1.10.x still
      # flow. Deferred #705 on 2026-05-26; remove the minor entry to revisit.
      - dependency-name: "org.jetbrains.compose"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.livekit:livekit-android"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.credentials:credentials"
        update-types: ["version-update:semver-major"]

  # Express API npm dependencies
  - package-ecosystem: "npm"
    directory: "/express-api"
    target-branch: "develop"  # SHY-0242: git-flow — develop, not main
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        update-types:
          - "patch"

  # Root npm dependencies (Playwright, sharp)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"  # SHY-0242: git-flow — develop, not main
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        update-types:
          - "patch"
    ignore:
      # SHY-0568: firebase 13 (#2190) broke the root `npm ci` because
      # @firebase/rules-unit-testing 5 peers firebase ^12. Both move
      # together, with their integration runs, in SHY-0570.
      - dependency-name: "firebase"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    # Composite actions under .github/actions/** must be bumped in the SAME
    # PR as the workflows that call them — one SHA repo-wide per action repo
    # (SHY-0162 invariant). Watching only "/" left the composites invisible,
    # so #1587/#1646 moved workflow pins alone and the resulting two-SHA
    # drift failed every queued Dependabot PR (SHY-0226). Every existing
    # .github/actions/* directory is declared; the exhaustiveness is pinned
    # by dependabot-composite-actions-coverage.test.js.
    directories:
      - "/"
      - "/.github/actions/apk-holds-no-persona-password"
      - "/.github/actions/cleanup-ios-signing"
      - "/.github/actions/decode-google-services"
      - "/.github/actions/decode-keystore"
      - "/.github/actions/deploy-firebase-rules"
      - "/.github/actions/harden-apt"
      - "/.github/actions/install-ffmpeg"
      - "/.github/actions/publish-gh-pages"
      - "/.github/actions/seed-test-personas"
      - "/.github/actions/setup-ios-signing"
      - "/.github/actions/setup-jdk-gradle"
      - "/.github/actions/setup-node"
      - "/.github/actions/start-firebase-emulators"
      - "/.github/actions/start-local-services"
    # Same-repo sub-actions (init/autobuild/analyze; cache/restore/save) are
    # separate "dependencies" to Dependabot, so ungrouped they arrive as
    # separate per-sub-path PRs — each one a one-SHA-invariant violation by
    # construction, and for codeql-action a runtime version-mismatch (#1649:
    # "Loaded a configuration file for version '4.36.3', but running version
    # '4.37.1'"). Grouping makes every sub-path ride ONE PR. These repo
    # groups sit BEFORE patch-updates: Dependabot assigns a dependency to
    # the first matching group, and same-repo cohesion must win over
    # update-type bundling. Exhaustiveness is pinned by
    # dependabot-composite-actions-coverage.test.js (any repo newly used
    # under a second sub-path fails the test until grouped here).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-cache:
        patterns:
          - "actions/cache*"
      patch-updates:
        update-types:
          - "patch"
    target-branch: "develop"  # SHY-0242: git-flow — develop, not main
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  # SHY-0544: local stack images (versitygw, LiveKit, Mailpit). Dependabot
  # cannot read the `docker run` lines in .github/actions/start-local-services,
  # so a bump here moves the compose pin alone and s3-stand-in-pin.test.js
  # fails until the action's pin is moved in the same PR.
  - package-ecosystem: "docker-compose"
    directory: "/local"
    target-branch: "develop"  # SHY-0242: git-flow — develop, not main
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
